name: Temporary Build Audit
on:
  push:
    branches:
      - audit/build-check
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
